name: Force inline artist wall background

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/force-inline-artist-wall.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline wall art into artist panel only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          index = Path('index.html')
          image = Path('images/artist-gallery-wall.jpg')
          s = index.read_text(encoding='utf-8')
          b64 = base64.b64encode(image.read_bytes()).decode('ascii')

          marker_start = '/* ARTIST WALL INLINE START */'
          marker_end = '/* ARTIST WALL INLINE END */'
          override = f'''\n    {marker_start}\n    .artist-exhibition {{\n      position: relative;\n      isolation: isolate;\n      background: #050209 !important;\n    }}\n    .artist-exhibition::before {{\n      content: "";\n      position: absolute;\n      inset: 0;\n      z-index: 0;\n      border-radius: inherit;\n      background: url("data:image/jpeg;base64,{b64}") center center / cover no-repeat;\n      opacity: 0.82;\n      pointer-events: none;\n    }}\n    .artist-exhibition::after {{\n      content: "";\n      position: absolute;\n      inset: 0;\n      z-index: 0;\n      border-radius: inherit;\n      background: linear-gradient(180deg, rgba(5,2,9,.08) 0%, rgba(5,2,9,.18) 42%, rgba(5,2,9,.34) 100%);\n      pointer-events: none;\n    }}\n    .artist-exhibition__header,\n    .artist-spinner {{\n      position: relative;\n      z-index: 1;\n    }}\n    {marker_end}\n'''

          pattern = re.compile(re.escape(marker_start) + r'.*?' + re.escape(marker_end), re.S)
          if pattern.search(s):
              s = pattern.sub(override.strip(), s, count=1)
          else:
              s = s.replace('\n  </style>', override + '\n  </style>', 1)

          index.write_text(s, encoding='utf-8')
          PY
      - name: Commit production fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'wildcarddev-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/force-inline-artist-wall.yml
          git commit -m 'Force artist wall behind gallery spinner'
          git push
