name: One-shot Penny slideout push trigger

on:
  push:
    branches: [penny-slideout-push-trigger]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch Penny main avatar only
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'PENNY AVATAR SLIDEOUT START' in text:
              raise SystemExit('already patched')
          marker = '<!-- Penny contact card -->'
          start = text.find(marker)
          end = text.find('</article>', start) + len('</article>')
          if start < 0 or end < len('</article>'):
              raise SystemExit('Penny main card not found')
          block = text[start:end]
          pattern = re.compile(r'<div class="contact-avatar">\s*<video\s+src="images/penny/PennyVsInstagram\.mp4"[^>]*></video>\s*</div>', re.S)
          replacement = '''<!-- PENNY AVATAR SLIDEOUT START -->
            <div class="penny-avatar-stack">
              <div class="contact-avatar">
                <video class="penny-autoplay-video penny-main-avatar-video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="images/penny/penny-hot-still.png" aria-label="Penny, WildCard DEV concierge">
                  <source src="images/penny/PennyVsInstagram.mp4" type="video/mp4" />
                </video>
              </div>
              <div class="penny-avatar-slideout" aria-label="Penny animated companion panel">
                <video class="penny-autoplay-video penny-avatar-slideout__video" autoplay muted loop playsinline webkit-playsinline preload="auto" poster="images/penny/PennyAnime-poster.jpg" aria-label="Penny animated companion">
                  <source src="images/penny/PennyAnime-slide.mp4" type="video/mp4" />
                </video>
              </div>
            </div>
            <!-- PENNY AVATAR SLIDEOUT END -->'''
          block2, count = pattern.subn(replacement, block, count=1)
          if count != 1:
              raise SystemExit(f'expected one main avatar, replaced {count}')
          text = text[:start] + block2 + text[end:]
          css_anchor = '    .contact-card h3 {'
          css = '''

    /* PENNY AVATAR SLIDEOUT CSS START */
    .contact-card.penny .penny-avatar-stack { position: relative; width: 168px; height: 154px; margin: 0 auto 12px; overflow: visible; }
    .contact-card.penny .penny-avatar-stack > .contact-avatar { position: relative; z-index: 3; margin: 0 auto; }
    .contact-card.penny .penny-main-avatar-video,
    .contact-card.penny .penny-avatar-slideout__video { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; background: #050712; }
    .contact-card.penny .penny-avatar-slideout { position: absolute; top: 62px; left: 50%; z-index: 2; width: 168px; aspect-ratio: 3 / 2; overflow: hidden; border: 1px solid rgba(255,121,200,.42); border-radius: 18px; background: rgba(5,7,18,.96); box-shadow: 0 18px 36px rgba(0,0,0,.44), 0 0 28px rgba(255,121,200,.24), inset 0 0 0 1px rgba(255,255,255,.08); transform: translate(-50%, -48px) scale(.84); transform-origin: top center; opacity: 0; pointer-events: none; animation: pennyAvatarSlideOut 900ms cubic-bezier(.2,.78,.22,1) 500ms forwards; }
    @keyframes pennyAvatarSlideOut { to { transform: translate(-50%, 0) scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .contact-card.penny .penny-avatar-slideout { animation: none; transform: translate(-50%,0) scale(1); opacity: 1; } }
    @media (min-width: 760px) and (max-width: 980px) { .contact-card.penny .penny-avatar-stack { width: 148px; height: 136px; } .contact-card.penny .penny-avatar-slideout { top: 54px; width: 148px; } }
    /* PENNY AVATAR SLIDEOUT CSS END */

'''
          if css_anchor not in text:
              raise SystemExit('CSS anchor not found')
          text = text.replace(css_anchor, css + css_anchor, 1)
          js = '''
<script>
  /* PENNY AUTOPLAY COMPAT START */
  (() => {
    const startPennyVideos = () => {
      document.querySelectorAll('.penny-autoplay-video').forEach((video) => {
        video.muted = true; video.defaultMuted = true; video.loop = true; video.playsInline = true;
        video.setAttribute('muted', ''); video.setAttribute('playsinline', '');
        const tryPlay = () => { const p = video.play(); if (p && typeof p.catch === 'function') p.catch(() => {}); };
        if (video.readyState >= 2) tryPlay(); else video.addEventListener('canplay', tryPlay, { once: true });
      });
    };
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', startPennyVideos, { once: true }); else startPennyVideos();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) startPennyVideos(); });
  })();
  /* PENNY AUTOPLAY COMPAT END */
</script>
'''
          text = text.replace('</body>', js + '\n</body>', 1)
          penny_start = text.find(marker); penny_end = text.find('</article>', penny_start) + len('</article>'); penny_block = text[penny_start:penny_end]
          assert penny_block.count('PennyVsInstagram.mp4') == 1
          assert penny_block.count('PennyAnime-slide.mp4') == 1
          assert 'No longer welcome on Meta Platforms for being a Bad Girl.' in penny_block
          warning_start = text.find('<div class="penny-coder-warning"'); warning_end = text.find('</article>', warning_start)
          assert warning_start >= 0 and warning_end > warning_start and 'penny-hot-still.png' in text[warning_start:warning_end]
          path.write_text(text, encoding='utf-8')

      - name: Commit only index.html
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "WildCard DEV Build"
          git config user.email "matt@wildcarddev.com"
          git add index.html
          git commit -m "Add Penny avatar slideout video"
          git push origin HEAD:main
