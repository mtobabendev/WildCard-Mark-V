name: Install Out4Good center panel

on:
  push:
    paths:
      - '.github/workflows/out4good-panel.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch only the top-spinner center panel
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          css_marker = '    .orbit-guidance {'
          css = '''    /* --- Out4Good static center panel --- */
    .orbit-center-panel {
      position: absolute;
      left: 50%;
      top: 48%;
      z-index: 1;
      width: clamp(190px, 26vw, 340px);
      aspect-ratio: 16 / 10;
      overflow: hidden;
      border-radius: 22px;
      background: #020408;
      box-shadow:
        0 18px 54px rgba(0, 0, 0, 0.58),
        inset 0 0 0 1px rgba(182, 255, 0, 0.18),
        0 0 30px rgba(182, 255, 0, 0.08);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .orbit-center-panel img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: none;
      opacity: 1;
    }

    .orbit-center-panel__warning {
      position: absolute;
      right: 10px;
      bottom: 10px;
      left: 10px;
      z-index: 2;
      margin: 0;
      padding: 8px 10px;
      border-radius: 999px;
      color: #b6ff00;
      background: rgba(2, 8, 2, 0.78);
      font-size: clamp(0.58rem, 1.35vw, 0.76rem);
      font-weight: 900;
      letter-spacing: 0.035em;
      line-height: 1.3;
      text-align: center;
      text-shadow: 0 0 8px rgba(182, 255, 0, 0.74), 0 0 18px rgba(182, 255, 0, 0.42);
      box-shadow: inset 0 0 0 1px rgba(182, 255, 0, 0.34), 0 0 18px rgba(182, 255, 0, 0.16);
      animation: out4goodWarningPulse 1.8s ease-in-out infinite;
    }

    @keyframes out4goodWarningPulse {
      0%, 100% {
        opacity: 0.68;
        text-shadow: 0 0 7px rgba(182, 255, 0, 0.56), 0 0 14px rgba(182, 255, 0, 0.28);
        box-shadow: inset 0 0 0 1px rgba(182, 255, 0, 0.24), 0 0 12px rgba(182, 255, 0, 0.10);
      }
      50% {
        opacity: 1;
        text-shadow: 0 0 10px rgba(182, 255, 0, 0.96), 0 0 24px rgba(182, 255, 0, 0.62);
        box-shadow: inset 0 0 0 1px rgba(182, 255, 0, 0.52), 0 0 26px rgba(182, 255, 0, 0.28);
      }
    }

'''

          if '.orbit-center-panel {' not in text:
              if css_marker not in text:
                  raise SystemExit('CSS anchor not found')
              text = text.replace(css_marker, css + css_marker, 1)

          html_marker = '            <div class="orbit-drag">'
          html = '''            <div class="orbit-center-panel" aria-label="Out4Good re-entry warning">
              <img src="images/spinner/out4good-static.webp" alt="Out4Good re-entry resources" />
              <p class="orbit-center-panel__warning">out4good is part of the system. Plan your re-entry accordingly...</p>
            </div>
'''

          if 'class="orbit-center-panel"' not in text:
              if html_marker not in text:
                  raise SystemExit('Top spinner anchor not found')
              text = text.replace(html_marker, html + html_marker, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit the surgical change
        run: |
          git config user.name "WildCard DEV Build"
          git config user.email "matt@wildcarddev.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index change required."
            exit 0
          fi
          git commit -m "Add Out4Good center warning [out4good-panel]"
          git push origin HEAD:main
