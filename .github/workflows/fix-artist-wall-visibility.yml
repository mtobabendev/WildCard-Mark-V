name: Fix artist wall visibility

on:
  push:
    branches: [main]
    paths:
      - 'artist-wall-visibility-trigger.txt'

permissions:
  contents: write

jobs:
  fix-wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Steven art actually visible behind spinner
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '.artist-exhibition__wall { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; border-radius: inherit; pointer-events: none; }'
          new = '.artist-exhibition__wall { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; border-radius: inherit; opacity: 1; filter: brightness(2.8) contrast(1.02); pointer-events: none; }'

          if new in s:
              print('Artist wall visibility already fixed.')
          elif old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('Expected artist wall CSS not found; refusing broad edit.')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix and clean up one-shot files
        shell: bash
        run: |
          git config user.name 'wildcarddev-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-artist-wall-visibility.yml artist-wall-visibility-trigger.txt
          git commit -m 'Make Steven art visible behind artist spinner'
          git push
