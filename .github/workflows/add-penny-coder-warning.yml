name: Add Penny coder warning

on:
  push:
    branches: [main]
    paths:
      - 'penny-coder-warning-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Penny coder warning only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          html_anchor = '''              </a>
            </div>
          </article>

          <!-- ===== ORBIT PRESENTATION SYSTEM ===== -->'''

          html_replacement = '''              </a>
            </div>

            <div class="penny-coder-warning" aria-label="ChatGPT coding warning from Penny">
              <div class="contact-avatar">
                <img src="images/penny/penny-hot-still.png" alt="Penny, WildCard DEV concierge" />
              </div>
              <h3>Penny — Code Warning</h3>
              <p>Yes, coders, this is where ChatGPT can't handle something as simple as some CSS fixes. So just be very, very careful if you're using it to code.</p>
              <div class="penny-coder-warning__arrow" aria-hidden="true">↓</div>
            </div>
          </article>

          <!-- ===== ORBIT PRESENTATION SYSTEM ===== -->'''

          if 'class="penny-coder-warning"' not in s:
              if html_anchor not in s:
                  raise SystemExit('Matt social insertion anchor not found; refusing broad edit.')
              s = s.replace(html_anchor, html_replacement, 1)

          css_anchor = '''    /* ===== INDEPENDENT FEATURED ARTIST SPINNER ===== */'''
          css_block = '''    /* ===== PENNY CODER WARNING ===== */
    .penny-coder-warning {
      width: 100%;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,121,200,.28);
      text-align: center;
    }
    .penny-coder-warning .contact-avatar {
      margin: 0 auto 10px;
    }
    .penny-coder-warning h3 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 1rem;
    }
    .penny-coder-warning p {
      margin: 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.48;
    }
    .penny-coder-warning__arrow {
      margin-top: 8px;
      color: var(--pink);
      font-size: 2.3rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 16px rgba(255,121,200,.72);
      animation: pennyWarningArrow 1.4s ease-in-out infinite;
    }
    @keyframes pennyWarningArrow {
      0%,100% { transform: translateY(0); opacity: .72; }
      50% { transform: translateY(6px); opacity: 1; }
    }

'''

          if '/* ===== PENNY CODER WARNING ===== */' not in s:
              if css_anchor not in s:
                  raise SystemExit('CSS insertion anchor not found; refusing broad edit.')
              s = s.replace(css_anchor, css_block + css_anchor, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit warning and clean up one-shot files
        shell: bash
        run: |
          git config user.name 'wildcarddev-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/add-penny-coder-warning.yml penny-coder-warning-trigger.txt
          git commit -m 'Add Penny ChatGPT coding warning'
          git push
