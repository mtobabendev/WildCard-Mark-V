name: Add Penny coder warning

on:
  push:
    branches: [main]
    paths:
      - 'penny-coder-warning-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert Penny coder warning only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'class="penny-coder-warning"' not in s:
              orbit_marker = '          <!-- ===== ORBIT PRESENTATION SYSTEM ===== -->'
              orbit_pos = s.find(orbit_marker)
              if orbit_pos == -1:
                  raise SystemExit('Orbit marker not found; refusing broad edit.')

              matt_close = s.rfind('          </article>', 0, orbit_pos)
              if matt_close == -1:
                  raise SystemExit('Matt card close not found; refusing broad edit.')

              warning_html = '''            <div class="penny-coder-warning" aria-label="ChatGPT coding warning from Penny">
              <div class="contact-avatar">
                <img src="images/penny/penny-hot-still.png" alt="Penny, WildCard DEV concierge" />
              </div>
              <p>Yes, coders, this is where ChatGPT can't handle something as simple as some CSS fixes. So just be very, very careful if you're using it to code.</p>
              <div class="penny-coder-warning__arrow" aria-hidden="true">↓</div>
            </div>

'''
              s = s[:matt_close] + warning_html + s[matt_close:]

          if '/* ===== PENNY CODER WARNING ===== */' not in s:
              css_marker = '    /* ===== INDEPENDENT FEATURED ARTIST SPINNER ===== */'
              css_pos = s.find(css_marker)
              if css_pos == -1:
                  raise SystemExit('Artist CSS marker not found; refusing broad edit.')

              warning_css = '''    /* ===== PENNY CODER WARNING ===== */
    .penny-coder-warning {
      width: 100%;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,121,200,.28);
      text-align: center;
    }
    .penny-coder-warning .contact-avatar {
      margin: 0 auto 10px;
      background: linear-gradient(135deg, rgba(255,121,200,.30), rgba(166,108,255,.18)), rgba(255,255,255,.05);
      box-shadow: inset 0 0 0 1px rgba(255,121,200,.42), 0 0 28px rgba(255,121,200,.24), 0 0 52px rgba(166,108,255,.12);
      animation: avatarPulsePenny 5.2s ease-in-out infinite, avatarFloat 5.6s ease-in-out infinite;
    }
    .penny-coder-warning .contact-avatar img {
      filter: saturate(1.12) contrast(1.06) brightness(1.05);
    }
    .penny-coder-warning p {
      margin: 0;
      color: var(--muted);
      font-size: .78rem;
      line-height: 1.48;
    }
    .penny-coder-warning__arrow {
      margin-top: 8px;
      color: var(--pink);
      font-size: 2.3rem;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 0 16px rgba(255,121,200,.72);
      animation: pennyWarningArrow 1.4s ease-in-out infinite;
    }
    @keyframes pennyWarningArrow {
      0%,100% { transform: translateY(0); opacity: .72; }
      50% { transform: translateY(6px); opacity: 1; }
    }

'''
              s = s[:css_pos] + warning_css + s[css_pos:]

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit warning only
        shell: bash
        run: |
          git config user.name 'wildcarddev-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index changes to commit.'
            exit 0
          fi
          git commit -m 'Add Penny ChatGPT coding warning'
          git push
