name: One-shot Penny main avatar replacement

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  replace-avatar:
    if: github.event.pull_request.head.ref == 'penny-avatar-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Replace only Penny main avatar image with uploaded loop
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          marker = '<!-- Penny contact card -->'
          start = text.find(marker)
          if start == -1:
              raise SystemExit('Penny contact card marker not found')

          end = text.find('</article>', start)
          if end == -1:
              raise SystemExit('Penny contact card closing article not found')
          end += len('</article>')

          block = text[start:end]
          pattern = r'(<div class="contact-avatar">\s*)<img\s+src="images/penny/penny-hot-still\.png"\s+alt="Penny, WildCard DEV concierge"\s*/>(\s*</div>)'
          replacement = r'\1<video src="images/penny/PennyVsInstagram.mp4" autoplay muted loop playsinline preload="metadata" aria-label="Penny, WildCard DEV concierge" style="display:block;width:100%;height:100%;object-fit:cover;"></video>\2'

          updated_block, count = re.subn(pattern, replacement, block, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one Penny main avatar image in target block, replaced {count}')

          updated = text[:start] + updated_block + text[end:]

          if updated.count('src="images/penny/PennyVsInstagram.mp4"') != 1:
              raise SystemExit('Penny avatar video reference count is not exactly one')
          if 'No longer welcome on Meta Platforms for being a Bad Girl.' not in updated:
              raise SystemExit('Penny card copy changed unexpectedly')
          warning_start = updated.find('<div class="penny-coder-warning"')
          if warning_start == -1:
              raise SystemExit('Coder-warning Penny clone missing')
          warning_end = updated.find('</article>', warning_start)
          warning_block = updated[warning_start:warning_end]
          if 'penny-hot-still.png' not in warning_block:
              raise SystemExit('Coder-warning Penny clone changed unexpectedly')

          path.write_text(updated, encoding='utf-8')

      - name: Commit only index.html
        run: |
          git config user.name "WildCard DEV Build"
          git config user.email "matt@wildcarddev.com"
          git add index.html
          git commit -m "Replace Penny main avatar with looping video"
          git push origin HEAD:main
