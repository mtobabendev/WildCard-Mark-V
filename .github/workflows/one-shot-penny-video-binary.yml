name: One-shot Penny video binary repair

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'penny-video-fix-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reconstruct and validate Penny avatar video
        shell: bash
        run: |
          set -euo pipefail
          echo "1a210e5d1bb7cd5bf0e6c1fa28a199489cf694b84fda5e605d6dd7aee8cafd2d  .tmp/penny-video/chunk1.b64" | sha256sum -c -
          echo "4794961eaa1351dfa5df2a1784e58ec44391134c50adcad33c93543ba8250687  .tmp/penny-video/chunk2.b64" | sha256sum -c -
          echo "2da6ff247fd0ad3efbd355eab55a5afb2f2d8cb4ec8832c9c76f3e133e5c5f32  .tmp/penny-video/chunk3.b64" | sha256sum -c -
          echo "b44890f02bbd7b8864ed8ae463e982e9b7a0843c6b518fcb7bcf068490311dd3  .tmp/penny-video/chunk4.b64" | sha256sum -c -
          echo "6a4a60b1f01939fac53a2cf6443441ed43223d9e1d18c89cf96f3ec78e4c39ea  .tmp/penny-video/chunk5.b64" | sha256sum -c -

          cat .tmp/penny-video/chunk1.b64 \
              .tmp/penny-video/chunk2.b64 \
              .tmp/penny-video/chunk3.b64 \
              .tmp/penny-video/chunk4.b64 \
              .tmp/penny-video/chunk5.b64 \
            | base64 -d > images/penny/PennyVsInstagram.mp4

          test "$(stat -c%s images/penny/PennyVsInstagram.mp4)" -eq 29545
          echo "a5816b30dd5f71f8033d89c5f762a39683558b28e6d51027627673dd0f95a779  images/penny/PennyVsInstagram.mp4" | sha256sum -c -

          if command -v ffprobe >/dev/null 2>&1; then
            ffprobe -v error images/penny/PennyVsInstagram.mp4 >/dev/null
          fi

      - name: Commit only repaired binary
        run: |
          git config user.name "WildCard DEV Build"
          git config user.email "matt@wildcarddev.com"
          git add images/penny/PennyVsInstagram.mp4
          git commit -m "Repair Penny avatar video binary"
          git push origin HEAD:main
