name: Fix artist gallery clean

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-artist-gallery-clean.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Clean artist wall and glass foreground
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from PIL import Image, ImageEnhance

          html = Path('index.html')
          s = html.read_text(encoding='utf-8')

          replacements = {
            r'\.artist-exhibition__wall \{[^}]*\}': '.artist-exhibition__wall { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; border-radius: inherit; opacity: 1; filter: none; mix-blend-mode: normal; image-rendering: auto; pointer-events: none; }',
            r'\.artist-card__inner \{[^}]*\}': '.artist-card__inner { position: absolute; inset: 0; border: 1px solid rgba(255,255,255,.34); border-radius: inherit; background: rgba(255,255,255,.025); box-shadow: 0 16px 42px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.18); backdrop-filter: none; -webkit-backdrop-filter: none; transform-style: preserve-3d; transition: transform 620ms cubic-bezier(.2,.75,.18,1); }',
            r'\.artist-card__face \{[^}]*\}': '.artist-card__face { position: absolute; inset: 0; display: grid; overflow: hidden; border-radius: inherit; background: transparent; backface-visibility: hidden; }',
            r'\.artist-card__back \{[^}]*\}': '.artist-card__back { align-content: center; gap: 10px; padding: clamp(18px,4vw,30px); transform: rotateY(180deg); background: rgba(8,4,13,.20); backdrop-filter: none; -webkit-backdrop-filter: none; text-align: left; }',
            r'\.artist-spinner__controls button \{[^}]*\}': '.artist-spinner__controls button { min-width: 48px; min-height: 46px; padding: .65rem .9rem; border: 1px solid rgba(255,255,255,.32); border-radius: 999px; background: rgba(8,4,13,.14); backdrop-filter: none; -webkit-backdrop-filter: none; color: var(--text); font: inherit; cursor: pointer; }',
          }
          for pattern, new in replacements.items():
            s, count = re.subn(pattern, new, s, count=1)
            if count != 1:
              raise SystemExit(f'Expected exactly one CSS match for {pattern}, got {count}')

          s = s.replace('fill="#08040d" fill-opacity=".08"', 'fill="none"', 1)
          html.write_text(s, encoding='utf-8')

          wall = Path('images/artist-gallery-wall.jpg')
          img = Image.open(wall).convert('RGB')
          img = ImageEnhance.Brightness(img).enhance(2.8)
          img.save(wall, format='JPEG', quality=94, optimize=True, progressive=True)
          PY
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'wildcarddev-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html images/artist-gallery-wall.jpg
          git rm .github/workflows/fix-artist-gallery-clean.yml
          git commit -m 'Clean artist wall and glass gallery'
          git push
