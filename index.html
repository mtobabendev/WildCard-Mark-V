<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08050d" />
  <meta name="description" content="Penny Connect Mark 1 branch preview bootloader." />
  <title>Penny Connect Mark 1 | Launching</title>
  <meta http-equiv="refresh" content="0; url=./penny-connect/" />
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      color: #fff8ff;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 91, 195, 0.28), transparent 38%),
        radial-gradient(circle at 20% 10%, rgba(141, 108, 255, 0.22), transparent 34%),
        linear-gradient(150deg, #060309, #100718 50%, #060309);
    }
    main {
      width: min(520px, calc(100% - 28px));
      padding: 28px;
      text-align: center;
      border: 1px solid rgba(255, 91, 195, 0.58);
      border-radius: 26px;
      background: rgba(14, 8, 20, 0.90);
      box-shadow: 0 30px 100px rgba(0,0,0,0.62), 0 0 50px rgba(255,91,195,0.16);
    }
    .mark {
      width: 86px;
      height: 86px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 91, 195, 0.75);
      border-radius: 50%;
      font-size: 2.2rem;
      box-shadow: 0 0 34px rgba(255,91,195,0.25);
      animation: pulse 1.25s ease-in-out infinite;
    }
    h1 { margin: 0 0 10px; letter-spacing: 0.07em; text-transform: uppercase; }
    p { margin: 0 0 18px; color: #d8c9dc; line-height: 1.5; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0.8rem 1.1rem;
      border: 1px solid rgba(255,91,195,0.72);
      border-radius: 999px;
      color: #fff8ff;
      text-decoration: none;
      font-weight: 850;
      background: linear-gradient(135deg, rgba(255,91,195,0.72), rgba(141,108,255,0.52));
    }
    @keyframes pulse { 50% { transform: scale(1.055); box-shadow: 0 0 54px rgba(255,91,195,0.38); } }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
  <script>
    window.location.replace(new URL('./penny-connect/', window.location.href).href);
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">P</div>
    <h1>Penny Connect Mark 1</h1>
    <p>Loading the working network heartbeat interface.</p>
    <a href="./penny-connect/">Open Penny Connect</a>
  </main>
</body>
</html>
